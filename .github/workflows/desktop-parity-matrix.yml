name: desktop-parity-matrix

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-e2e:
    name: parity-e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Run documentation coverage gate (TypeScript surfaces)
        run: bun run docs:check:ts

      - name: Run TypeScript gate
        run: bun run gate:typescript

      - name: Run desktop parity e2e tests
        run: bun run desktop:test:e2e

      - name: Run Rust workspace tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: cargo test --workspace --all-targets

      - name: Check Windows native engine
        if: runner.os == 'Windows'
        run: cargo check -p guerillaglass-engine-windows

      - name: Test Windows Authenticode helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p guerillaglass-engine-windows
          $helper = Join-Path $PWD "target/debug/guerillaglass-engine-windows.exe"
          $unsignedFixture = Join-Path $env:RUNNER_TEMP "unsigned-authenticode-fixture.exe"
          Copy-Item $helper $unsignedFixture -Force

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Guerillaglass CI Test Publisher" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256

          foreach ($storeName in @("Root", "TrustedPublisher")) {
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new($storeName, "CurrentUser")
            $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            $store.Add($cert)
            $store.Close()
          }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found in Windows Kits"
          }

          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $helper
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed with exit code $LASTEXITCODE"
          }

          $sha256 = [System.BitConverter]::ToString(
            [System.Security.Cryptography.SHA256]::Create().ComputeHash($cert.RawData)
          ).Replace("-", "").ToLowerInvariant()

          & $helper --verify-authenticode --path $helper --sha256-thumbprint $sha256 --subject-contains "Guerillaglass CI Test Publisher" --offline-revocation
          if ($LASTEXITCODE -ne 0) {
            throw "expected signed Authenticode fixture to verify"
          }

          & $helper --verify-authenticode --path $helper --sha256-thumbprint ("0" * 64) --subject-contains "Guerillaglass CI Test Publisher" --offline-revocation
          if ($LASTEXITCODE -eq 0) {
            throw "expected wrong Authenticode thumbprint to fail"
          }

          & $helper --verify-authenticode --path $unsignedFixture --sha256-thumbprint $sha256 --subject-contains "Guerillaglass CI Test Publisher" --offline-revocation
          if ($LASTEXITCODE -eq 0) {
            throw "expected unsigned Authenticode fixture to fail"
          }

      - name: Run Swift native tests (macOS)
        if: runner.os == 'macOS'
        run: |
          swift build
          swift test
          swift build -c release --product guerillaglass-code-signature-checker

      - name: Test macOS code-signature helper
        if: runner.os == 'macOS'
        run: |
          fixture="$RUNNER_TEMP/gg-code-signature-fixture"
          cp /bin/echo "$fixture"
          codesign --force --sign - --identifier com.guerillaglass.ci.fixture "$fixture"
          helper=".build/release/guerillaglass-code-signature-checker"
          "$helper" --path "$fixture" --requirement 'identifier "com.guerillaglass.ci.fixture"'
          if "$helper" --path "$fixture" --requirement 'identifier "com.guerillaglass.ci.wrong"'; then
            echo "expected wrong macOS code-signing requirement to fail" >&2
            exit 1
          fi
