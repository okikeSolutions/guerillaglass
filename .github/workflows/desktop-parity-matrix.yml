name: desktop-parity-matrix

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity-e2e:
    name: parity-e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run desktop parity e2e tests
        run: bun run desktop:test:e2e

      - name: Run Rust workspace tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: cargo test --workspace --all-targets

      - name: Check Windows native engine
        if: runner.os == 'Windows'
        run: cargo check -p guerillaglass-engine-windows

      - name: Test Windows Authenticode helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p guerillaglass-engine-windows
          $helper = Join-Path $PWD "target/debug/guerillaglass-engine-windows.exe"
          $unsignedFixture = Join-Path $env:RUNNER_TEMP "unsigned-authenticode-fixture.exe"
          Copy-Item $helper $unsignedFixture -Force

          function Invoke-ProcessWithTimeout($FilePath, [string[]] $Arguments, [int] $TimeoutSeconds) {
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo.FileName = $FilePath
            foreach ($argument in $Arguments) {
              [void] $process.StartInfo.ArgumentList.Add($argument)
            }
            $process.StartInfo.UseShellExecute = $false
            $process.StartInfo.RedirectStandardOutput = $true
            $process.StartInfo.RedirectStandardError = $true
            [void] $process.Start()
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              $process.Kill($true)
              throw "Process timed out after ${TimeoutSeconds}s: $FilePath $($Arguments -join ' ')"
            }
            $stdout = $process.StandardOutput.ReadToEnd()
            $stderr = $process.StandardError.ReadToEnd()
            if ($stdout) { Write-Host $stdout }
            if ($stderr) { Write-Host $stderr }
            return $process.ExitCode
          }

          $exitCode = Invoke-ProcessWithTimeout $helper @(
            "--verify-authenticode",
            "--path", $unsignedFixture,
            "--sha256-thumbprint", ("0" * 64),
            "--subject-contains", "Guerillaglass CI Test Publisher",
            "--offline-revocation"
          ) 30
          if ($exitCode -eq 0) {
            throw "expected unsigned Authenticode fixture to fail"
          }

      - name: Run Swift native tests (macOS)
        if: runner.os == 'macOS'
        run: |
          swift test
          swift build -c release --product guerillaglass-code-signature-checker

      - name: Test macOS code-signature helper
        if: runner.os == 'macOS'
        run: |
          fixture="$RUNNER_TEMP/gg-code-signature-fixture"
          cp /bin/echo "$fixture"
          codesign --force --sign - --identifier com.guerillaglass.ci.fixture "$fixture"
          helper=".build/release/guerillaglass-code-signature-checker"
          "$helper" --path "$fixture" --requirement 'identifier "com.guerillaglass.ci.fixture"'
          if "$helper" --path "$fixture" --requirement 'identifier "com.guerillaglass.ci.wrong"'; then
            echo "expected wrong macOS code-signing requirement to fail" >&2
            exit 1
          fi
