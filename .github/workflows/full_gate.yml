name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript + desktop tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize Effect vendor submodule
        run: git submodule update --init vendor/effect

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: cd apps/desktop-electrobun && bun run test:ui:install

      - name: TypeScript lint/type/contract gate
        run: bun run gate:typescript
        env:
          SKIP_DESKTOP_TESTS: "1"

      - name: Install coverage dependencies
        run: brew install jq

      - name: TypeScript coverage thresholds
        run: bun run coverage:check
        env:
          COVERAGE_SCOPE: typescript

      - name: Desktop browser tests
        run: cd apps/desktop-electrobun && bun run test:ui:ci -- --run

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo format check
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install Rust coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov

      - name: Install coverage dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Rust coverage thresholds
        run: bash ./Scripts/coverage_check.sh
        env:
          COVERAGE_SCOPE: rust

  swift:
    name: Swift
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned SwiftFormat and SwiftLint
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.62.1/swiftformat.zip \
            --output /tmp/swiftformat.zip
          unzip -q /tmp/swiftformat.zip -d /tmp/swiftformat
          sudo install /tmp/swiftformat/swiftformat /usr/local/bin/swiftformat
          brew install swiftlint
          swiftformat --version

      - name: Remove temporary experiments
        run: rm -rf .tmp

      - name: SwiftFormat lint
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint --quiet

      - name: Install coverage dependencies
        run: brew install jq

      - name: Swift coverage thresholds
        run: bash ./Scripts/coverage_check.sh
        env:
          COVERAGE_SCOPE: swift

  protocol-generation:
    name: Protocol generation determinism
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Generate protocol bindings and verify deterministic inventory
        run: bun run protocol:check-determinism

      - name: Assert generated files are current
        run: git diff --exit-code
