name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript + desktop tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: cd apps/desktop-electrobun && bun run test:ui:install

      - name: TypeScript gate
        run: bun run gate:typescript

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo format check
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo tests
        run: cargo test --workspace --all-targets

  swift:
    name: Swift
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Swift tools
        run: brew install swiftformat swiftlint

      - name: Remove temporary experiments
        run: rm -rf .tmp

      - name: SwiftFormat lint
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint --quiet

      - name: Swift tests
        run: swift test

  protocol-generation:
    name: Protocol generation determinism
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Generate protocol bindings
        run: bun run protocol:generate-bindings

      - name: Format generated Rust bindings
        run: cargo fmt --all

      - name: Assert generated files are current
        run: git diff --exit-code

  coverage:
    name: Coverage thresholds
    # Run threshold checks on PRs too so coverage regressions block before merge.
    # `Scripts/coverage_check.sh` excludes desktop parity/native launch e2e tests that
    # are already covered by the TypeScript and desktop-parity-matrix jobs.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov

      - name: Install coverage dependencies
        run: brew install jq

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Coverage threshold gate
        run: bun run coverage:check
